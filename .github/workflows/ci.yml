name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  deployment_status:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    env:
      AGENT_API_KEY: ci-dummy-key
      REDIS_URL: fake://
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run offline checkpoints
        run: >-
          python -m pytest tests/ -v
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py
          -m "not docker"

  build:
    name: Build Docker image
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag day12-agent:${{ github.sha }} .

  deploy:
    name: Release Railway deployment
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Open deployment gate
        run: echo "Tests and image build passed; Railway Wait for CI may deploy this commit."

  post-deploy:
    name: Smoke test Railway deployment
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'production'
    env:
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      DEPLOY_API_KEY: ${{ secrets.DEPLOY_API_KEY }}
    steps:
      - name: Check health and readiness
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "${PUBLIC_URL}/health" \
              && curl --fail --silent --show-error "${PUBLIC_URL}/ready"; then
              exit 0
            fi
            echo "Smoke test attempt ${attempt}/12 failed; retrying..."
            sleep 5
          done
          exit 1

      - name: Check authenticated API
        if: env.DEPLOY_API_KEY != ''
        run: |
          curl --fail --silent --show-error \
            --request POST "${PUBLIC_URL}/ask" \
            --header "Content-Type: application/json" \
            --header "X-API-Key: ${DEPLOY_API_KEY}" \
            --header "X-User-Id: ci-smoke-test" \
            --data '{"question":"CI deployment smoke test"}'
